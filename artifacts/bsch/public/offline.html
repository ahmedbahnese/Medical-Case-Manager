<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>غير متصل — BSCH</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #f0fdfa;
      color: #134e4a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      background: #0f766e;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .cross {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .cross::before,
    .cross::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 3px;
    }

    .cross::before {
      width: 12px;
      height: 40px;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .cross::after {
      width: 40px;
      height: 12px;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #0f766e;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #5a7d7a;
      max-width: 360px;
      margin: 0 auto 0.5rem;
    }

    .hint {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 1rem;
    }

    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0d6259; }
    button:active { background: #0a4f48; }

    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <div class="icon">
    <div class="cross"></div>
  </div>

  <h1>غير متصل بالشبكة</h1>
  <p>لا يمكن الوصول إلى نظام BSCH حاليًا.</p>
  <p>تأكد من اتصالك بالشبكة المحلية للمستشفى ثم حاول مجددًا.</p>

  <p class="hint">
    إذا كانت هذه الرسالة تظهر دائمًا، تحقق من أن الخادم<br/>
    على الحاسب الرئيسي يعمل (StartServer.bat).
  </p>

  <button onclick="retry()">إعادة المحاولة</button>
  <div class="status" id="status"></div>

  <script>
    function retry() {
      const status = document.getElementById('status');
      status.textContent = 'جارٍ الاتصال...';
      fetch('/api/healthz')
        .then(() => { window.location.reload(); })
        .catch(() => {
          status.textContent = 'الخادم غير متاح. تحقق من الاتصال بالشبكة.';
        });
    }
  </script>
</body>
</html>
