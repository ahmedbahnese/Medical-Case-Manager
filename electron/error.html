<!DOCTYPE html>

    p { color: #6b7280; font-size: 0.9rem; }

  </style>

<body>
  <div class="box">
    <h1>⚠️ تعذر تشغيل الخادم</h1>

    <button onclick="location.reload()">إعادة المحاولة</button>

</html>
