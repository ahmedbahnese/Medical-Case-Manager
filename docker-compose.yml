version: "3.9"

# ============================================================
# BSCH — Docker Compose Stack
# Usage:
#   1. cp .env.example .env   (and fill in DB_PASSWORD, SESSION_SECRET)
#   2. docker compose up -d --build
#   3. Open http://localhost (or http://YOUR_IP)
# ============================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bsch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsch_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — set it in .env}
      POSTGRES_DB: bsch_db
    volumes:
      - bsch_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # Only accessible from localhost (not public)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsch_user -d bsch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BSCH Application ───────────────────────────────────────────────────────
  app:
    build: .
    container_name: bsch_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://bsch_user:${DB_PASSWORD}@db:5432/bsch_db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — set it in .env}
      FOUNDER_PASSWORD: ${FOUNDER_PASSWORD:-bsch2024}
      SETTINGS_PASSWORD: ${SETTINGS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - bsch_backups:/app/backups

volumes:
  bsch_pgdata:
    driver: local
  bsch_backups:
    driver: local
