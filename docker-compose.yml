version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bsch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsch_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: bsch_db
    volumes:
      - bsch_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsch_user -d bsch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BSCH Application ───────────────────────────────────────────────────────
  app:
    build: .
    container_name: bsch_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://bsch_user:${DB_PASSWORD:-change_me}@db:5432/bsch_db
      SESSION_SECRET: ${SESSION_SECRET:-change_me_in_production}
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - bsch_backups:/app/backups

volumes:
  bsch_pgdata:
  bsch_backups:
