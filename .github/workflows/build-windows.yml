name: Build Windows 7 installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-ia32:
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production web assets
        run: pnpm build:prod

      - name: Install Electron build dependencies
        working-directory: electron
        run: npm ci

      - name: Build Windows ia32 installer
        working-directory: electron
        run: npm run build-installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BSCH-Windows-ia32
          path: electron/dist-electron/BSCH-Setup-ia32-*.exe
          if-no-files-found: error
          retention-days: 30
